<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FOCLYRA — Welcome</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f8ff;
            color: #172033;
        }

        .login-container {
            width: 100%;
            max-width: 430px;
            padding: 25px;
        }

        .login-card {
            background: white;
            border-radius: 24px;
            padding: 45px 38px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(40, 70, 120, 0.12);
            border: 1px solid #e8eef8;
        }

        .logo {
            width: 58px;
            height: 58px;
            margin: 0 auto 18px;
            border-radius: 16px;
            background: #2563eb;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
            font-weight: 800;
        }

        h1 {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #718096;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .continue-btn {
            display: block;
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .continue-btn:hover {
            transform: translateY(-2px);
            background: #1d4ed8;
        }

        .note {
            margin-top: 20px;
            font-size: 12px;
            color: #8a94a6;
            line-height: 1.5;
        }

        .back-link {
            display: inline-block;
            margin-top: 24px;
            color: #2563eb;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="logo">F</div>

            <h1>Welcome to FOCLYRA</h1>

            <p class="subtitle">
                Your intelligent study planner.<br>
                Let's build a smarter study routine.
            </p>

            <button class="continue-btn" onclick="continueToPlanner()">
                Continue to FOCLYRA →
            </button>

            <p class="note">
                Your study data stays on this device.
            </p>

            <a href="index.html" class="back-link">
                ← Back to FOCLYRA
            </a>

        </div>

    </div>

    <script>
        function continueToPlanner() {
            window.location.href = "planner.html";
        }
    </script>

</body>
</html>
